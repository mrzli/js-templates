name: flashcards-be

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_USER: flashcards
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
